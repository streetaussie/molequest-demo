  const beat=Math.floor(step/2),offbeat=step%2===1,barBeat=beat%4,chord=lofiProgression[Math.floor(beat/8)%lofiProgression.length];
  if(beat%8===0)chord.notes.forEach((f,i)=>lofiRhodes(f,at+i*.018,i===0 ? .045 : .030));
  if(!offbeat&&barBeat===0){lofiKick(at,.060);tone(chord.root,0,.48,.036,"sine",chord.root*.98,0,musicBus)}
  if(!offbeat&&barBeat===2)lofiKick(at,.036);
  if(!offbeat&&(barBeat===1||barBeat===3))lofiSnare(at);
  if(offbeat&&(barBeat===0||barBeat===2))lofiNoise(at,.035,.0035,"highpass",7200);
  if(step%32===27)lofiNoise(at,.035,.0025,"bandpass",1250);
}
function lofiScheduler(){
  if(!soundEnabled||!audioCtx){lofiTimer=null;return}
  const horizon=audioCtx.currentTime+.14,stepTime=(60/68)/2;
  while(nextLofiTime<horizon){scheduleLofiStep(lofiStepIndex,nextLofiTime);lofiStepIndex++;nextLofiTime+=stepTime}
  lofiTimer=window.setTimeout(lofiScheduler,35);
}
function startLofi(){if(lofiTimer!==null)return;if(audioReady()){nextLofiTime=audioCtx.currentTime+.08;lofiStepIndex=0;lofiScheduler()}}
function stopLofi(){if(lofiTimer!==null){clearTimeout(lofiTimer);lofiTimer=null}}
function updateSoundButton(){const b=$("soundToggle");if(!b)return;b.textContent=soundEnabled?"♫ Sound on":"♫ Sound off";b.setAttribute("aria-pressed",soundEnabled?"true":"false")}
$("soundToggle").onclick=()=>{
  soundEnabled=!soundEnabled;try{localStorage.setItem("molequest-sound",soundEnabled?"on":"off")}catch(e){}
  if(soundEnabled){audioReady();if(audioMaster)audioMaster.gain.setTargetAtTime(.78,audioCtx.currentTime,.06);startLofi();playTap()}
  else{stopLofi();if(audioCtx&&audioMaster)audioMaster.gain.setTargetAtTime(0,audioCtx.currentTime,.06)}
  updateSoundButton();
};
updateSoundButton();
const ringR=n=>n<2?0:1+.32*n;
let G={players:[],cur:0,target:20,phase:"setup",hist:[],msg:""};
const STANDALONE=true;
let standaloneBoard=[],standaloneNext=1,boardCards=[],boardLegal=true;
let atoms=[],mol=null,molOptions=[],selectedMolName="",slot=[],bondT=0,lpStart=0,lpEnd=0,curScale=50,rot=0,boardKey="~",empty=0,simShown=false;

// ---------- canvas ----------
const cv=$("cv"),ctx=cv.getContext("2d");let W=0,H=0,dpr=1;
function fit(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;const w=Math.round(W*dpr),h=Math.round(H*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
function proj(x,y,z,sc){const ca=Math.cos(rot),sa=Math.sin(rot),X=x*ca+z*sa,Z=-x*sa+z*ca,ct=Math.cos(.28),st=Math.sin(.28),Y2=y*ct-Z*st,Z2=y*st+Z*ct,k=14/(14-Z2);return[W/2+X*k*sc,H/2-Y2*k*sc,Z2,k]}
function ball(x,y,r,col,txt,tc){
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x-r*.4,y-r*.4,r*.05,x,y,r);
  g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(.5,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(0,0,0,.35)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  if(txt){ctx.fillStyle=tc;ctx.font="700 "+Math.max(10,r*.85)+"px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,x,y+r*.04)}
}
const ease=s=>1+2.70158*Math.pow(s-1,3)+1.70158*Math.pow(s-1,2);
const LPCOL="#ffd84a",ECOL="#8fe3ff";
// Yellow lone pairs (and blue unpaired electrons of a single atom) that should be visible at time t
function extras(t){
  const out=[];
  if(mol){
    if(t<lpStart||t>lpEnd+600)return out;
    const al=t>lpEnd?1-(t-lpEnd)/600:1,s=ease(Math.min(1,(t-lpStart)/450));
    lpDirs(mol).forEach(x=>{if(slot[x.i]!==undefined)out.push({a:slot[x.i],d:x.d,k:"lp",al,s})});
  }else if(atoms.length===1){
    const s=ease(Math.max(0,Math.min(1,(t-atoms[0].born-300)/450)));
    if(s>.01)freeAtom(atoms[0].el).forEach(x=>out.push({a:0,d:x.d,k:x.k,al:1,s}));
  }
  return out;
}
function frame(t){
  requestAnimationFrame(frame);fit();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);rot+=.006;
  if(!atoms.length)return;
  if(mol)geo(mol);
  const R=mol?mol.R:ringR(atoms.length),m=Math.min(W,H);
  curScale+=(Math.min(m/7,m*.36/(R+.9))-curScale)*.08;const sc=curScale;
  const pts=atoms.map(a=>{for(let k=0;k<3;k++)a.p[k]+=(a.t[k]-a.p[k])*.07;return proj(a.p[0],a.p[1],a.p[2],sc)});
  const items=[];
  if(mol&&t>bondT){
    // Each bond is projected from its 3D endpoints and split into depth-sorted tube sections.
    // This lets one part pass behind an atom while another part stays in front.
    const al=Math.min(1,(t-bondT)/600),bondColor=getComputedStyle(document.documentElement).getPropertyValue("--bond").trim()||"#9fb0c3",sections=20;
    mol.bonds.forEach(([i,j,o])=>{
      const ai=atoms[slot[i]],aj=atoms[slot[j]];if(!ai||!aj)return;
      const dv=vsub(aj.p,ai.p),len=vlen(dv);if(len<.001)return;const axis=vmul(dv,1/len),side=perp(axis);
      const p0=vadd(ai.p,vmul(axis,Math.min(EL[ai.el].r*.75,len*.32))),p1=vsub(aj.p,vmul(axis,Math.min(EL[aj.el].r*.75,len*.32)));
      for(let q=0;q<o;q++){
        const off=(q-(o-1)/2)*.16,from=vadd(p0,vmul(side,off)),to=vadd(p1,vmul(side,off)),delta=vsub(to,from);
        for(let k=0;k<sections;k++){
          const u0=k/sections,u1=(k+1)/sections,A=proj(from[0]+delta[0]*u0,from[1]+delta[1]*u0,from[2]+delta[2]*u0,sc),B=proj(from[0]+delta[0]*u1,from[1]+delta[1]*u1,from[2]+delta[2]*u1,sc);
          const z=(A[2]+B[2])/2,scale=(A[3]+B[3])/2,dx=B[0]-A[0],dy=B[1]-A[1],segLen=Math.hypot(dx,dy)||1,nx=-dy/segLen,ny=dx/segLen,w=Math.max(2,.052*sc*scale);
          items.push({z,draw:()=>{
            ctx.globalAlpha=al;ctx.lineCap="round";ctx.lineWidth=w+2.2;ctx.strokeStyle="rgba(4,11,19,.62)";ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
            const g=ctx.createLinearGradient(A[0],A[1],B[0],B[1]);g.addColorStop(0,"#607589");g.addColorStop(.45,bondColor);g.addColorStop(1,"#657b90");ctx.lineWidth=w;ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
            ctx.globalAlpha=al*.46;ctx.lineWidth=Math.max(.8,w*.16);ctx.strokeStyle="#edf7ff";ctx.beginPath();ctx.moveTo(A[0]+nx*w*.17,A[1]+ny*w*.17);ctx.lineTo(B[0]+nx*w*.17,B[1]+ny*w*.17);ctx.stroke();ctx.globalAlpha=1;
          }});
        }
      }
    });
  }
  atoms.forEach((at,i)=>items.push({z:pts[i][2],draw:()=>{
    const e=EL[at.el],q=pts[i],s=Math.min(1,(t-at.born)/450),ea=ease(s),r=Math.max(.1,e.r*sc*.75*q[3]*ea);
    ball(q[0],q[1],r,e.c,at.el,e.t);
    if(s<1){ctx.globalAlpha=1-s;ctx.strokeStyle="#4fd1a5";ctx.lineWidth=3;ctx.beginPath();ctx.arc(q[0],q[1],r*(1+s*1.1),0,7);ctx.stroke();ctx.globalAlpha=1}
  }}));
  extras(t).forEach(x=>{
    const at=atoms[x.a],dist=lpDist(at.el),q=proj(at.p[0]+x.d[0]*dist,at.p[1]+x.d[1]*dist,at.p[2]+x.d[2]*dist,sc);
    items.push({z:q[2],draw:()=>{const r=(x.k==="lp"?.18:.09)*sc*q[3]*x.s;if(r<1)return;ctx.globalAlpha=x.al;ball(q[0],q[1],r,x.k==="lp"?LPCOL:ECOL);ctx.globalAlpha=1}});
  });
  items.sort((a,b)=>a.z-b.z).forEach(it=>it.draw());
}
requestAnimationFrame(frame);

// ---------- board -> atoms ----------
function sync(list){
  const want={},have={};list.forEach(e=>want[e]=(want[e]||0)+1);
  atoms=atoms.filter(a=>{have[a.el]=(have[a.el]||0)+1;return have[a.el]<=(want[a.el]||0)});
  Object.keys(want).forEach(e=>{const c=atoms.filter(a=>a.el===e).length;
    for(let k=c;k<want[e];k++)atoms.push({el:e,p:[(Math.random()-.5)*2,5,0],t:[0,0,0],born:performance.now()})});
  const key=keyOf(list),old=mol;molOptions=MOL.filter(m=>m.key===key);mol=molOptions.find(m=>m.name===selectedMolName)||molOptions[0]||null;selectedMolName=mol?mol.name:"";slot=[];
  if(mol){
    const g=geo(mol),used=new Set();
    mol.atoms.forEach((e,i)=>{const k=atoms.findIndex((a,j)=>a.el===e&&!used.has(j));used.add(k);atoms[k].t=g[i].slice();slot[i]=k});
    if(mol!==old){bondT=performance.now()+800;lpStart=bondT+700;lpEnd=lpStart+5000}
  }else{
    const n=atoms.length,r=ringR(n);
    atoms.forEach((a,i)=>{const g=i/n*Math.PI*2;a.t=n<2?[0,0,0]:[Math.cos(g)*r,Math.sin(g)*r,0]});
  }
}
function showLP(){if(mol){lpStart=performance.now();lpEnd=lpStart+5000}}
function onBoard(raw){
  const previousIds=new Set(boardCards.map(c=>c.id)),hadCards=boardCards.length>0;
  boardCards=raw.slice();
  const added=boardCards.filter(c=>!previousIds.has(c.id)),list=raw.map(c=>c.element).sort(),sig=raw.map(c=>c.id).sort().join("|");
  boardLegal=true;
  empty=list.length?0:empty+1;
  if(hadCards&&!boardCards.length&&G.phase==="cleanup")playClear();
  if(sig!==boardKey){
    boardKey=sig;const oldMol=mol;sync(list);
    if(added.length){playScan(added.length);added.slice(0,3).forEach((c,i)=>window.setTimeout(()=>playElementPop(c.element,i),70+i*150))}
    if(mol&&mol!==oldMol){const bondCount=mol.bonds.length,charge=mol.ch;window.setTimeout(()=>playBondBuild(bondCount),650);window.setTimeout(()=>playMoleculeReveal(charge),1180)}
    else if(added.length&&list.length>1&&!mol)playSoftNo();
    if(G.phase==="play")G.msg=!list.length?"Place your cards, or skip and take 2 cards from the shared pool.":mol?(mol.ch?"Ion":"Molecule")+" found! Press Claim to score.":"No molecule yet. Add or change cards, or skip your turn.";
    updateUI();
  }
  if(G.phase==="cleanup"&&empty>=3)nextTurn();
}
// ---------- game ----------
function showModal(html){$("mbox").innerHTML=html;$("modal").style.display="flex"}
function hideModal(){$("modal").style.display="none"}
function setup(){
  G={players:[],cur:0,target:20,phase:"setup",hist:[],msg:""};updateUI();
  showModal('<h2>Mole-Quest</h2><div>Points = number of atoms + π bonds (double bond: +1; triple bond: +2).</div><p>Deal up to 5 physical cards to each player; the rest form a shared pool. Build and claim a molecule, then return its cards to the pool. If you skip, the turn ends immediately and you take 2 cards from the pool. After a claim, clear the reader and the next turn starts automatically. The game does not ask which cards you take or track private hands. Return all cards to the pool before starting a new game.</p><p><label>Players <select id="np"><option>2</option><option>3</option><option>4</option></select></label></p><div id="names"></div><p><label>Target score <input id="tg" type="number" value="20" min="3" style="width:80px"></label></p><button class="btn go" id="go">Start game</button>');
  const names=()=>{const n=+$("np").value;$("names").innerHTML=Array.from({length:n},(_,i)=>'<input class="nm" placeholder="Player '+(i+1)+'">').join("")};
  $("np").onchange=names;names();
  $("go").onclick=()=>{
    if(soundEnabled){audioReady();startLofi();playStart()}
    const nm=[...document.querySelectorAll(".nm")].map((x,i)=>x.value.trim()||"Player "+(i+1));
    G={players:nm.map(name=>({name,score:0})),cur:0,target:Math.max(3,+$("tg").value||20),phase:"play",hist:[],msg:"Build and claim a molecule, or skip and take 2 cards from the shared pool."};
    empty=0;boardKey="~";standaloneBoard=[];standaloneNext=1;if(!STANDALONE)fetch("/sim?clear=1");hideModal();updateUI();
  };
}
function claim(){
  if(G.phase!=="play"||!mol||!boardLegal)return;
  const p=G.players[G.cur];playClaim();
  p.score+=mol.pts;
  G.hist.unshift(p.name+" built "+mol.name+" (+"+mol.pts+")");
  if(p.score>=G.target){playVictory();G.phase="won";updateUI();showModal('<h2>'+p.name+' wins!</h2><div style="font-size:18px;margin:8px 0 14px">'+p.score+' points. Last molecule: '+mol.name+' ('+mol.formula+')</div><button class="btn go" id="again">New game</button>');$("again").onclick=setup;return}
  G.phase="cleanup";empty=0;G.msg="+"+mol.pts+" points! Return the cards to the shared pool and clear the reader; the next turn starts automatically.";updateUI();
}
function skipTurn(){
  if(G.phase!=="play"||boardCards.length)return;
  playSkip();const p=G.players[G.cur];
  G.hist.unshift(p.name+" skipped and took 2 cards");
  G.cur=(G.cur+1)%G.players.length;G.phase="play";
  G.msg=p.name+" skipped and takes 2 cards from the shared pool.";updateUI();
}
function nextTurn(){
  playTurnPass();G.cur=(G.cur+1)%G.players.length;G.phase="play";G.msg="Build and claim a molecule, or skip and take 2 cards from the shared pool.";boardKey="~";updateUI();
}
function updateUI(){
  const P=G.players;
  $("pl").innerHTML=P.map((p,i)=>'<tr class="'+(i===G.cur&&G.phase!=="won"?"on":"")+'"><td>'+p.name+'</td><td>'+p.score+' / '+G.target+'</td></tr>').join("");
  if(!P.length){$("turn").textContent="";$("msg").textContent="";$("info").innerHTML="";$("btns").innerHTML="";$("hist").innerHTML="";$("banner").textContent="";return}
  $("turn").textContent=G.phase==="won"?"Game over":P[G.cur].name+"'s turn";
  $("msg").textContent=G.msg;
  $("banner").textContent=G.phase==="cleanup"?"Clear the reader; next turn starts automatically":"";
  const row=r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';
  let h="";
  if(mol){
    const chooser=molOptions.length>1?'<div class="hint">Several species can use these atoms. Choose one: <select id="molchoice">'+molOptions.map(m=>'<option value="'+m.name+'"'+(m.name===mol.name?' selected':'')+'>'+m.name+(m.ch?' ('+m.formula+')':'')+'</option>').join("")+'</select></div>':'';
    const s=mol.bonds.filter(b=>b[2]===1).length,d=mol.bonds.filter(b=>b[2]===2).length,t=mol.bonds.filter(b=>b[2]===3).length;
    const ty=[s&&s+" single",d&&d+" double",t&&t+" triple"].filter(Boolean).join(", ");
    const n=Math.abs(mol.ch),chTxt=mol.ch?n+(mol.ch>0?"+":"−")+" ("+n+(mol.ch>0?" missing":" extra")+(n>1?" electrons)":" electron)"):"";
    const rows=[[mol.ch?"Formula mass":"Molecular mass",mol.mass.toFixed(2)+" g/mol"],["Bonds",mol.bonds.length+" ("+ty+")"],["Sigma bonds (σ)",mol.bonds.length],["Pi bonds (π)",mol.pi],["Shape",mol.shape],["Bond angle",mol.angle],["Lone pairs",mol.lpText]];
    if(mol.ch)rows.push(["Charge",chTxt]);else rows.push(["Boiling point",mol.bp],["Freezing point",mol.fp]);
    rows.push(["Points",mol.atoms.length+" atoms + "+mol.pi+" π = "+mol.pts]);
    h=chooser+'<h2>'+(mol.ch?"Ion":"Molecule")+' formed</h2><div id="mname">'+mol.name+'</div><div id="mform">'+mol.formula+'</div>'+rows.map(row).join("")+
      '<div id="fact">'+mol.fact+'</div>'+(mol.ch?"":'<div class="hint">Boiling and freezing points are at normal pressure (1 atm).</div>')+
      '<button class="btn" data-lp="1">Show lone pairs (L)</button>';
  }else if(atoms.length===1){
    const e=EL[atoms[0].el];
    h='<h2>Element</h2><div id="mname">'+e.n+'</div><div id="mform">'+atoms[0].el+'</div>'+
      [["Atomic number",e.z],["Atomic mass",e.m+" u"],["Electron configuration",e.cfg],["Valence electrons",e.ve],["Lone pairs (yellow)",e.lp0||"None"],["Unpaired electrons (blue)",e.un0],["Usually forms",e.val+(e.val>1?" bonds":" bond")]].map(row).join("")+
      '<div id="fact">Add more cards to build a molecule.</div>';
  }else if(atoms.length)h='<h2>Molecule</h2><div id="mname">No molecule yet</div>';
  $("info").innerHTML=h;
  const can=G.phase==="play";
  $("btns").innerHTML=G.phase==="cleanup"?'<button class="btn" disabled>Waiting for reader to clear…</button>':'<button class="btn go" data-c="claim"'+(can&&mol&&boardLegal?"":" disabled")+'>'+(mol?"Claim "+mol.name+" (+"+mol.pts+")":"Claim molecule")+'</button><button class="btn" data-c="skip"'+(can&&!boardCards.length?"":" disabled")+'>Skip turn · take 2 cards</button>';
  $("hist").innerHTML=G.hist.slice(0,5).map(x=>"• "+x).join("<br>");
}
$("info").onclick=e=>{if(e.target.closest("[data-lp]")){playLonePair();showLP()}};
$("info").onchange=e=>{if(e.target.id==="molchoice"){playTap();selectedMolName=e.target.value;boardKey="~"}};
$("btns").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.c==="claim")claim();else if(b.dataset.c==="skip")skipTurn();else if(b.dataset.c==="next")nextTurn()};
$("demo").onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;
  if(STANDALONE){
    if(a==="clear"){playTap();standaloneBoard=[]}
    else if(a==="undo"){playTap();standaloneBoard.pop()}
    else standaloneBoard.push({id:"DEMO-SCAN-"+String(standaloneNext++).padStart(5,"0"),element:a});
    onBoard(standaloneBoard);return;
  }
  if(a==="clear"||a==="undo")playTap();fetch(a==="clear"?"/sim?clear=1":a==="undo"?"/sim?undo=1":"/sim?add="+a)};
document.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>e.preventDefault()));
document.addEventListener("keydown",e=>{
  if($("modal").style.display==="flex")return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();claim()}
  else if(e.key.toLowerCase()==="d"){simShown=!simShown}
  else if(e.key.toLowerCase()==="l"){showLP()}
});

// ---------- poll the game program ----------
async function poll(){
  if(STANDALONE){
    $("rd").textContent="Standalone demo · no RFID reader";
    $("demo").style.display="flex";
    onBoard(standaloneBoard);
    setTimeout(poll,300);return;
  }
  try{
    const d=await (await fetch("/board")).json();
    $("rd").textContent=d.reader?"Reader connected":"Demo mode (no reader): use the demo cards";
    $("demo").style.display=(!d.reader||simShown)?"flex":"none";
    onBoard(d.board);
  }catch(e){$("rd").textContent="Lost connection to the game program"}
  setTimeout(poll,300);
}
setup();poll();
